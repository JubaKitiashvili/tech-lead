name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check.mjs

  skill-quality:
    name: Skill quality (SkillEvaluator)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Keyless static checks only: no model and no API key.
      - run: pip install skillevaluator==1.0.1
      # Grade A is 90 or more. Every skill has to reach it.
      - run: |
          for skill in . skills/quick skills/loop skills/panel skills/research; do
            skillevaluator quality-check "$skill" --min-score 90 -r cli -o "$RUNNER_TEMP/skill-reports"
          done

  test:
    name: Test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Both systems are required. Linux skips the tests that are written for macOS only.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The loop tests create git repositories and commit in them.
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: node --test $(find tests -name '*.test.mjs' | sort)

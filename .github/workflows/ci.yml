name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check.mjs

  test:
    name: Test suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS is where the suite is developed and is the required result. Linux runs too, but
    # three tests fail there (two git trace2 controls, one process-ownership check), so its
    # result is reported without failing the run until they are fixed.
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The loop tests create git repositories and commit in them.
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - run: node --test $(find tests -name '*.test.mjs' | sort)
